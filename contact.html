<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cosine Records - Contact</title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="contact.css" type="text/css">
        <link rel="icon" type="image/png" href="CosineFavicon.png">
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Cosine Records</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" aria-current="page" href="index.html"><i class="bi bi-house-door"></i> Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="album.html"><i class="bi bi-disc"></i> Albums & Singles</a>
            </li>
            <li class="nav-item">
            <a class="nav-link active" href="contact.html"><i class="bi bi-envelope"></i> Contact</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="instrument.html"><i class="bi bi-music-note-beamed"></i> Instruments</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="inspiration.html"><i class="bi bi-lightbulb"></i> Inspirations</a>
            </li>
        </ul>
        </div>
    </div>
    </nav>
    <div class="container py-5">
  <!-- Page Header -->
  <div class="row justify-content-center text-center mb-5">
    <div class="col-lg-8">
      <span class="badge bg-primary bg-opacity-15 text-primary mb-2 px-3 py-2 rounded-pill fw-semibold">Get in Touch</span>
      <h1 class="display-5 fw-bold text-light mb-3">We'd Love to Hear From You</h1>
      <p class="text-light lead fs-6">Have questions or want to work together? Fill out the form or find us on the map below.</p>
    </div>
  </div>

  <div class="row g-4 align-items-stretch">
    <!-- Contact Form Card -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 h-100 bg-white">
        <h3 class="fw-bold mb-4 text-info">Send a Message</h3>
        <form>
          <div class="mb-3">
            <label for="name" class="form-label text-secondary fw-medium">Your Name</label>
            <input type="text" class="form-control form-control-lg bg-light border-0 fs-6" id="name" placeholder="John Doe" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-secondary fw-medium">Email Address</label>
            <input type="email" class="form-control form-control-lg bg-light border-0 fs-6" id="email" placeholder="name@example.com" required>
          </div>
          <div class="mb-4">
            <label for="message" class="form-label text-secondary fw-medium">Your Message</label>
            <textarea class="form-control form-control-lg bg-light border-0 fs-6" id="message" rows="4" placeholder="How can we help you?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-semibold shadow-sm">Send Message</button>
        </form>
      </div>
    </div>

    <!-- Map & Info Section -->
    <div class="col-lg-6">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 h-100 bg-white d-flex flex-column justify-content-between">
        <div>
          <h3 class="fw-bold mb-3 text-info">Our Location</h3>
          <p class="text-light mb-4">Here is where the record label is based off of.</p>
        </div>
        <div class="ratio ratio-4x3 rounded-4 overflow-hidden shadow-sm flex-grow-1">
          <iframe id="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1612512.055848144!2d-123.73947894354944!3d37.873447534520025!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808583a3a688d7b5%3A0x8c891b8457461fa9!2sSan%20Francisco%20Bay%20Area%2C%20CA!5e0!3m2!1sen!2sus!4v1789059468495!5m2!1sen!2sus" width="750" height="750" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="contact.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
